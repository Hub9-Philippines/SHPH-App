---
# This file controls Trunk behavior:
# https://docs.trunk.io/cli
# Format reference:
# https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Plugins extend Trunk. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# Runtimes used by linters/tools. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# Linter/tool configuration. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - dart@3.10.8
    - checkov@3.3.6
    - git-diff-check
    - grype@0.114.0
    - markdownlint@0.49.0
    - osv-scanner@2.3.8
    - oxipng@10.1.1
    - prettier@3.9.4
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - trufflehog@3.95.5
    - yamllint@1.38.0
  ignore:
    - linters: [dart]
      paths:
        # Generated code
        - lib/**/*.g.dart
        - lib/**/*.freezed.dart
        - lib/**/*.gr.dart
        # Flutter Flow generated code
        - lib/flutter_flow/**
        - lib/custom_code/**
        # Build artifacts
        - build/**
        - .dart_tool/**
        - ios/Pods/**
        - android/.gradle/**
        - android/app/src/main/java/io/**
        - .flutter-plugins
        - .flutter-plugins-dependencies
        - pubspec.lock
    - linters: [prettier]
      paths:
        - "**/*.lock"
        - build/**
        - .dart_tool/**
  triggers:
    - linters:
        - dart
        - prettier
      paths:
        - "**/*.dart"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.json"
        - "**/*.md"
      targets:
        - "**/*.dart"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.json"
        - "**/*.md"
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
