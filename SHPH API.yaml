          type: string
        agreed_price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
          nullable: true
        total_price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
          nullable: true
        hardware_parts_cost:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Optional hardware/parts cost entered by the provider.
        hardware_parts_cost_approved:
          type: boolean
          description: Set to False when the provider changes the parts cost; the
            customer must approve it before the provider can mark the job complete.
        hardware_parts_description:
          type: string
          description: Optional label for the hardware/parts the provider added (e.g.
            'Deadbolt Cylinder').
          maxLength: 120
        fee_breakdown:
          readOnly: true
          description: Detailed fee breakdown stored at booking time.
        arrived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when the provider marked themselves as arrived (status
            → arrived).
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: 'Timestamp when work actually began (status → in_progress).
            The elapsed-working-time clock is derived from this, so it must come from
            the server: the provider app used to count from page mount, which reset
            to 0:00 on every refresh and stopped meaning anything once the app was
            backgrounded.'
        start_pin:
          type: string
          nullable: true
          description: |-
            Only the client can read the real PIN — the provider must be told
            it verbally/in person, matching the mockup's UX. Returns None for
            everyone else (including the provider) rather than omitting the key,
            so the frontend can rely on the key always being present.
          readOnly: true
        client_confirmed_arrival:
          type: boolean
          readOnly: true
          description: Set True when the client confirms the provider has arrived
            (alternative to the start PIN for authorizing arrived → in_progress).
        provider_lat:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        provider_lng:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        service_lat:
          type: number
          format: float
          readOnly: true
        service_lng:
          type: number
          format: float
          readOnly: true
        client_address:
          type: string
          description: |-
            The unit/floor line — released only once the job is actually taken.

            The client owns the data and always sees it. The provider gets it after
            acceptance, not while the booking is still PENDING: the scheduled path
            assigns a PENDING booking to the nearest provider before they accept or
            decline, and handing over an exact unit and gate code at that point
            breaks the same invariant that keeps this off the broadcast fan-out.
            Anyone else gets nothing.
          readOnly: true
        completion_photo_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        completion_photo_urls:
          readOnly: true
        has_review:
          type: boolean
          readOnly: true
        has_on_demand_job:
          type: boolean
          readOnly: true
        on_demand_job_id:
          type: string
          readOnly: true
        payment_confirmed:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agreed_price
      - arrived_at
      - client
      - client_address
      - client_confirmed_arrival
      - client_id
      - client_name
      - client_photo
      - completion_photo_urls
      - created_at
      - fee_breakdown
      - has_on_demand_job
      - has_review
      - id
