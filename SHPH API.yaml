components:
  schemas:
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
        street:
          type: string
          minLength: 1
        barangay:
          type: string
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        province:
          type: string
          minLength: 1
          maxLength: 100
        zip_code:
          type: string
          maxLength: 10
        latitude:
          type: number
          format: double
          writeOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          writeOnly: true
          nullable: true
        is_default:
          type: boolean
      required:
      - city
      - province
      - street
    AdminKycSubmissionRequest:
      type: object
      properties:
        id_type:
          type: string
          minLength: 1
          maxLength: 50
        id_front_url:
          type: string
          format: uri
          default: ''
        id_back_url:
          type: string
          format: uri
          default: ''
        selfie_url:
          type: string
          format: uri
          default: ''
        liveness_score:
          type: number
          format: double
          nullable: true
        submitter_role:
          $ref: '#/components/schemas/SubmitterRoleEnum'
        nbi_clearance_url:
          type: string
          format: uri
          default: ''
        portfolio_url:
          type: string
          format: uri
          default: ''
        resume_url:
          type: string
          format: uri
          default: ''
        status:
          $ref: '#/components/schemas/KycSubmissionStatusEnum'
        rejection_reason:
          type: string
        reviewed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id_type
    AdminPayoutRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provider_email:
          type: string
          format: email
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        payment_method:
          type: integer
          nullable: true
        payment_method_provider:
          type: string
          readOnly: true
        amount:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        status:
          allOf:
          - $ref: '#/components/schemas/PayoutRequestStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - amount
      - created_at
      - id
      - payment_method_provider
      - processed_at
      - provider_email
      - provider_name
      - status
    AdminPayoutRequestRequest:
      type: object
      properties:
        payment_method:
          type: integer
          nullable: true
        amount:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
      required:
      - amount
    AdminStatsResponse:
      type: object
      properties:
        total_users:
          type: integer
        pending_kyc:
          type: integer
        open_disputes:
          type: integer
        active_bookings:
          type: integer
        pending_payouts:
          type: integer
      required:
      - active_bookings
      - open_disputes
      - pending_kyc
      - pending_payouts
      - total_users
    AuditLogRecentResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items: {}
      required:
      - count
      - results
    AuthSuccessResponse:
      type: object
      description: Response shape for successful authentication (register/login).
      properties:
        user:
          $ref: '#/components/schemas/User'
        access:
          type: string
        refresh:
          type: string
        session_id:
          type: string
      required:
      - access
      - refresh
      - session_id
      - user
    AutoDismissEnum:
      enum:
      - never
      - 1h
      - 6h
      - 1d
      - 3d
      - 1w
      type: string
      description: |-
        * `never` - Never
        * `1h` - 1 Hour
        * `6h` - 6 Hours
        * `1d` - 1 Day
        * `3d` - 3 Days
        * `1w` - 1 Week
    BiometricAuthOptionsRequestRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
    BiometricAuthVerifyRequestRequest:
      type: object
      properties:
        challenge_id:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        rawId:
          type: string
          minLength: 1
        response: {}
        type:
          type: string
          minLength: 1
        device_name:
          type: string
          minLength: 1
        platform:
          type: string
          minLength: 1
      required:
      - challenge_id
      - id
      - response
    BiometricRegisterVerifyRequestRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        rawId:
          type: string
          minLength: 1
        response: {}
        type:
          type: string
          minLength: 1
        device_name:
          type: string
          minLength: 1
        platform:
          type: string
          minLength: 1
      required:
      - id
      - response
    Booking:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        listing:
          type: integer
        listing_title:
          type: string
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        provider_photo:
          type: string
          readOnly: true
          default: ''
        client:
          type: integer
          readOnly: true
        client_id:
          type: integer
          readOnly: true
        provider_id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/ServiceBookingStatusEnum'
        scheduled_date:
          type: string
          format: date
          nullable: true
        scheduled_time:
          type: string
          format: time
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        agreed_price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
          nullable: true
        total_price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
          nullable: true
        hardware_parts_cost:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Optional hardware/parts cost entered by the provider.
        hardware_parts_cost_approved:
          type: boolean
          description: Set to False when the provider changes the parts cost; the
            customer must approve it before the provider can mark the job complete.
        fee_breakdown:
          readOnly: true
          description: Detailed fee breakdown stored at booking time.
        arrived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when the provider marked themselves as arrived (status
            → arrived).
        provider_lat:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        provider_lng:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        completion_photo_url:
          type: string
          format: uri
          maxLength: 200
        has_review:
          type: boolean
          readOnly: true
        has_on_demand_job:
          type: boolean
          readOnly: true
        on_demand_job_id:
          type: string
          readOnly: true
        payment_confirmed:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agreed_price
      - arrived_at
      - client
      - client_id
      - created_at
      - fee_breakdown
      - has_on_demand_job
      - has_review
      - id
      - listing
      - listing_title
      - on_demand_job_id
      - payment_confirmed
      - provider_id
      - provider_name
      - provider_photo
      - total_price
    BookingRequest:
      type: object
      properties:
        listing:
          type: integer
        status:
          $ref: '#/components/schemas/ServiceBookingStatusEnum'
        scheduled_date:
          type: string
          format: date
          nullable: true
        scheduled_time:
          type: string
          format: time
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        hardware_parts_cost:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Optional hardware/parts cost entered by the provider.
        hardware_parts_cost_approved:
          type: boolean
          description: Set to False when the provider changes the parts cost; the
            customer must approve it before the provider can mark the job complete.
        provider_lat:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        provider_lng:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        completion_photo_url:
          type: string
          format: uri
          maxLength: 200
      required:
      - listing
    BookingRescheduleRequestRequest:
      type: object
      properties:
        scheduled_at:
          type: string
          format: date-time
      required:
      - scheduled_at
    BookingUpdateRequest:
      type: object
      description: |-
        Serializer for PATCH/PUT on an existing booking.

        Locks the money, listing, and schedule fields so a client cannot tamper with
        the price (e.g. PATCH total_price=1 then pay ₱1) or repoint/reschedule the
        booking outside the dedicated, slot-checked endpoints. total_price /
        fee_breakdown are always derived server-side (at creation, and recomputed in
        perform_update when hardware_parts_cost changes).
      properties:
        status:
          $ref: '#/components/schemas/ServiceBookingStatusEnum'
        notes:
          type: string
        hardware_parts_cost:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Optional hardware/parts cost entered by the provider.
        hardware_parts_cost_approved:
          type: boolean
          description: Set to False when the provider changes the parts cost; the
            customer must approve it before the provider can mark the job complete.
        provider_lat:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        provider_lng:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        completion_photo_url:
          type: string
          format: uri
          maxLength: 200
    CancelQuoteResponse:
      type: object
      description: Response shape for the booking cancellation fee preview endpoint.
      properties:
        fee:
          type: string
          description: Cancellation fee as a decimal string
        free:
          type: boolean
          description: True when the cancellation is free
      required:
      - fee
      - free
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        icon:
          type: string
          maxLength: 100
        color:
          type: string
          description: 'Accent color hex code (e.g. #368EFF) used for category cards
            and badges.'
          maxLength: 7
        image:
          type: string
          format: uri
          nullable: true
        description:
          type: string
        is_on_demand:
          type: boolean
          description: If true, customers are routed to the on-demand booking flow
            instead of the standard scheduled booking.
        service_type:
          allOf:
          - $ref: '#/components/schemas/ServiceTypeEnum'
          description: |-
            time_material = immediate/proximity-based (≤4km). time_frame = project-based, provider can come from any city.

            * `time_material` - Time & Material
            * `time_frame` - Time Frame
        parent:
          type: integer
          nullable: true
          description: If set, this is a sub-category of the parent.
        has_subcategories:
          type: boolean
          readOnly: true
        has_active_provider:
          type: boolean
          readOnly: true
        active_provider_ids:
          type: array
          items: {}
          readOnly: true
        suggested_min_price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: Suggested minimum base price for provider listings in this
            category (₱).
        suggested_max_price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: Suggested maximum base price for provider listings in this
            category (₱).
        alias:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - active_provider_ids
      - alias
      - has_active_provider
      - has_subcategories
      - id
      - name
      - slug
    CategoryEnum:
      enum:
      - booking
      - payment
      - account
      - other
      type: string
      description: |-
        * `booking` - Booking
        * `payment` - Payment
        * `account` - Account
        * `other` - Other
    ChatMessage:
      type: object
      description: Serializer for chat messages
      properties:
        id:
          type: string
          readOnly: true
        thread:
          type: string
          readOnly: true
        sender:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Get sender with deleted-user safety. Uses sender_id to avoid
            Djongo cross-db FK object access which may return None.

            Prefers a pre-built user_cache from the view / consumer to avoid N+1.
          readOnly: true
        content:
          type: string
        file_attachment:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
        file_type:
          type: string
          nullable: true
          maxLength: 50
        file_type_display:
          type: string
          readOnly: true
        is_deleted:
          type: boolean
        edited_at:
          type: string
          format: date-time
          nullable: true
        reply_to:
          type: object
          additionalProperties: {}
          nullable: true
          description: Serialize the message this message is replying to.
          readOnly: true
        sticker:
          type: string
          nullable: true
          maxLength: 100
        is_system_message:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - file_type_display
      - id
      - reply_to
      - sender
      - thread
      - updated_at
    ChatMessageRequest:
      type: object
      description: Serializer for chat messages
      properties:
        content:
          type: string
          minLength: 1
        file_attachment:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
        file_type:
          type: string
          nullable: true
          maxLength: 50
        is_deleted:
          type: boolean
        edited_at:
          type: string
          format: date-time
          nullable: true
        sticker:
          type: string
          nullable: true
          maxLength: 100
        is_system_message:
          type: boolean
      required:
      - content
    ChatThreadDetail:
      type: object
      description: Detailed serializer for chat threads with full message history
      properties:
        id:
          type: string
          readOnly: true
        booking:
          type: string
          nullable: true
        booking_id:
          type: string
          readOnly: true
        client:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Get client with deleted-user safety. Uses client_id to avoid
            Djongo cross-db FK object access which may return None.

            Prefers a pre-built user_cache to avoid N+1.
          readOnly: true
        provider:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Get provider with deleted-user safety. Uses provider_id to avoid
            Djongo cross-db FK object access which may return None.

            Prefers a pre-built user_cache to avoid N+1.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        last_message:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Get the last non-deleted message in the thread.

            Prefers a pre-built last_message_cache to avoid per-thread queries.
          readOnly: true
        unread_count:
          type: integer
          description: |-
            Get unread message count for the requesting user.
            Prefers a pre-built unread_count_cache to avoid per-thread queries.
          readOnly: true
        other_participant:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Get the other participant in the chat.
            Prefers a pre-built user_cache to avoid per-thread User queries.
          readOnly: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Return the most recent non-deleted messages, oldest-first.

            Bounded to THREAD_DETAIL_MESSAGE_LIMIT so a long thread can't produce an
            unbounded payload (older history is available via the paginated
            ChatMessageListView).

            Builds batched sender + reply_to caches here so the nested
            ChatMessageSerializer never N+1s on obj.reply_to / obj.sender —
            regardless of whether the calling view pre-populated context.
          readOnly: true
      required:
      - booking_id
      - client
      - created_at
      - id
      - last_message
      - messages
      - other_participant
      - provider
      - unread_count
      - updated_at
    ChatThreadDetailRequest:
