      description: |-
        GET  /api/auth/biometric/credentials/
        Returns the list of WebAuthn credentials registered by the authenticated user.
        The response also includes a `is_current_device` flag based on the User-Agent
        so the client can highlight the device the user is currently on.

        DELETE /api/auth/biometric/credentials/<credential_id>/
        Removes a specific credential belonging to the authenticated user.
      tags:
      - api
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_auth_biometric_credentials_create
