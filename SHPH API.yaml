    ChatThreadDetail:
      type: object
      description: Detailed serializer for chat threads with full message history
      properties:
        id:
          type: string
          readOnly: true
        booking:
          type: string
          nullable: true
        booking_id:
          type: string
          readOnly: true
        thread_type:
          $ref: '#/components/schemas/VideoCallCallTypeEnum'
        title:
          type: string
          nullable: true
          maxLength: 200
        is_admin_thread:
          type: boolean
        created_by:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        participants:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Serialize the participants embedded array. Each entry includes the
            resolved user dict, role, joined_at, and last_read_at.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        last_message:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Get the last non-deleted message in the thread.

            Prefers a pre-built last_message_cache to avoid per-thread queries.
          readOnly: true
        unread_count:
          type: integer
          description: |-
            Get unread message count for the requesting user.
            Prefers a pre-built unread_count_cache to avoid per-thread queries.
          readOnly: true
        other_participant:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            For DIRECT threads, return the participant that is not the
            requesting user. Returns None for group threads (the UI renders the
            full participant list instead).
          readOnly: true
        is_muted:
          type: boolean
          readOnly: true
        is_pinned:
          type: boolean
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Return the most recent non-deleted messages, oldest-first.

            Bounded to THREAD_DETAIL_MESSAGE_LIMIT so a long thread can't produce an
            unbounded payload (older history is available via the paginated
            ChatMessageListView).

            Builds batched sender + reply_to caches here so the nested
            ChatMessageSerializer never N+1s on obj.reply_to / obj.sender —
            regardless of whether the calling view pre-populated context.
          readOnly: true
        retention_state:
          type: string
          description: |-
            Where this thread sits in the post-completion lifecycle.

            Derived from the booking rather than stored here. A ``read_only_at``
            column would be a second copy of a fact the booking already holds, and
            the two drift the moment a completion is corrected.

            A thread with no booking — direct, group, staff — is always OPEN. This
            lifecycle belongs to booking conversations only.
          readOnly: true
      required:
      - booking_id
      - created_at
      - created_by
      - id
      - is_archived
      - is_muted
      - is_pinned
      - last_message
      - messages
      - other_participant
      - participants
