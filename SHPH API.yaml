    VideoCall:
      type: object
      description: |-
        Serializer for video calls.

        Uses context caches to avoid N+1 queries because cross-db
        ``prefetch_related`` is not supported across MongoDB ↔ PostgreSQL.
        Includes the unified ``participants`` array (for group calls) plus the
        legacy ``caller``/``callee`` FKs retained for backward compatibility.
      properties:
        id:
          type: string
          readOnly: true
        thread_id:
          type: string
          readOnly: true
        booking_id:
          type: string
          nullable: true
          readOnly: true
        call_type:
          $ref: '#/components/schemas/VideoCallCallTypeEnum'
        topology:
          $ref: '#/components/schemas/TopologyEnum'
        media_type:
          $ref: '#/components/schemas/VideoCallMediaTypeEnum'
        sfu_room_id:
          type: string
          nullable: true
          maxLength: 100
        caller:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        callee:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        participants:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        status:
          $ref: '#/components/schemas/VideoCallStatusEnum'
        start_message_id:
          type: string
          nullable: true
          description: ID of the ChatMessage that announced this group call.
          maxLength: 48
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration:
          type: integer
          readOnly: true
          description: Duration in seconds
        reason:
          type: string
          nullable: true
          maxLength: 255
      required:
      - booking_id
      - callee
      - caller
      - duration
      - ended_at
      - id
      - participants
      - started_at
      - thread_id
    VideoCallCallTypeEnum:
      enum:
      - direct
      - group
      type: string
      description: |-
        * `direct` - Direct
        * `group` - Group
    VideoCallMediaTypeEnum:
      enum:
      - video
      - audio
      type: string
      description: |-
        * `video` - Video
        * `audio` - Audio
    VideoCallRequest:
      type: object
      description: |-
        Serializer for video calls.

        Uses context caches to avoid N+1 queries because cross-db
        ``prefetch_related`` is not supported across MongoDB ↔ PostgreSQL.
        Includes the unified ``participants`` array (for group calls) plus the
        legacy ``caller``/``callee`` FKs retained for backward compatibility.
      properties:
        call_type:
          $ref: '#/components/schemas/VideoCallCallTypeEnum'
        topology:
          $ref: '#/components/schemas/TopologyEnum'
        media_type:
          $ref: '#/components/schemas/VideoCallMediaTypeEnum'
        sfu_room_id:
          type: string
          nullable: true
          maxLength: 100
        status:
          $ref: '#/components/schemas/VideoCallStatusEnum'
        start_message_id:
          type: string
          nullable: true
          description: ID of the ChatMessage that announced this group call.
          maxLength: 48
        reason:
          type: string
          nullable: true
          maxLength: 255
