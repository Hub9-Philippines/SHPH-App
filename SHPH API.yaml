components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 50
        street:
          type: string
        barangay:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        province:
          type: string
          maxLength: 100
        zip_code:
          type: string
          maxLength: 10
        location:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          writeOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          writeOnly: true
          nullable: true
        is_default:
          type: boolean
      required:
      - city
      - id
      - province
      - street
    AdminKycSubmission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        user_name:
          type: string
          readOnly: true
        id_type:
          type: string
          maxLength: 50
        id_front_url:
          type: string
          format: uri
          default: ''
        id_back_url:
          type: string
          format: uri
          default: ''
        selfie_url:
          type: string
          format: uri
          default: ''
        liveness_score:
          type: number
          format: double
          nullable: true
        submitter_role:
          $ref: '#/components/schemas/SubmitterRoleEnum'
        nbi_clearance_url:
          type: string
          format: uri
          default: ''
        portfolio_url:
          type: string
          format: uri
          default: ''
        resume_url:
          type: string
          format: uri
          default: ''
        status:
          $ref: '#/components/schemas/AdminKycSubmissionStatusEnum'
        rejection_reason:
          type: string
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - id_type
      - submitted_at
      - user
      - user_email
      - user_name
    AdminKycSubmissionStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending Review
        * `approved` - Approved
        * `rejected` - Rejected
    AdminPayoutRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provider_email:
          type: string
          format: email
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        payment_method:
          type: integer
          nullable: true
        payment_method_provider:
          type: string
          readOnly: true
        amount:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusA8fEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - amount
      - created_at
      - id
      - payment_method_provider
      - processed_at
      - provider_email
      - provider_name
      - status
    Booking:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        listing:
          type: integer
        listing_title:
          type: string
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        provider_photo:
          type: string
          readOnly: true
          default: ''
        client:
          type: integer
          readOnly: true
        client_id:
          type: integer
          readOnly: true
        provider_id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/BookingStatusEnum'
        scheduled_date:
          type: string
          format: date
          nullable: true
        scheduled_time:
          type: string
          format: time
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        agreed_price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        total_price:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        provider_lat:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        provider_lng:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        has_review:
          type: string
          readOnly: true
        payment_confirmed:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client
      - client_id
      - created_at
      - has_review
      - id
      - listing
      - listing_title
      - payment_confirmed
      - provider_id
      - provider_name
      - provider_photo
    BookingStatusEnum:
      enum:
