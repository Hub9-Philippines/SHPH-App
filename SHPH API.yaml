    VideoCallStatusEnum:
      enum:
      - initiated
      - accepted
      - rejected
      - ended
      - missed
      type: string
      description: |-
        * `initiated` - Initiated
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `ended` - Ended
        * `missed` - Missed
  securitySchemes:
    cookieAuth:
