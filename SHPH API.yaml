        POST /api/services/bookings/<pk>/reschedule/
        Body: { "scheduled_at": "<ISO-8601 datetime>" }

        Validates:
        - Booking belongs to the requesting user (as client)
        - Booking is in a reschedulable state (pending or confirmed)
        - New scheduled_at is in the future

        Saves the new time and fires a signal-based notification to the provider
        via the existing post_save signal on ServiceBooking.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
