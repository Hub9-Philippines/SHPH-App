openapi: 3.0.3
info:
  title: SHPH API
  version: 1.0.0
  description: |-
    Serbisyo Hub PH — On-demand Service Provider Platform API

    ## Authentication
    Most endpoints require a JWT access token in the `Authorization` header:
    `Bearer <token>`

    ## Roles
    - **Client** — books services, pays, chats with providers
    - **Provider** — offers services, manages bookings, earns income
    - **Admin** — manages disputes, KYC, payouts (staff users)

    ## Post-over-GET
    For endpoints that return authenticated user data, a `POST` with an empty body `{}` is accepted as an alternative to `GET`. This prevents sensitive data from being logged in URL query strings.

    ## Pagination
    List endpoints return paginated responses:
    `{ count, next, previous, results }`
paths:
  /api/admin/stats/:
    get:
      operationId: admin_stats_retrieve
      description: |-
        Get dashboard counts for admin including users, pending KYC, open disputes, active bookings, and pending payouts.

        **Frontend:** Admin dashboard
      summary: Admin dashboard stats
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              examples:
                FieldValidationError:
                  value:
                    error: true
                    detail:
                      category:
                      - Invalid pk "999" - object does not exist.
                    status_code: 400
                  summary: Raised ValidationError with field-level messages
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              examples:
                SimpleDetailMessage:
                  value:
                    error: true
                    detail:
                      detail: Authentication credentials were not provided.
                    status_code: 401
                  summary: Raised exception with a single detail message (403/404/etc.)
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              examples:
                SimpleDetailMessage:
                  value:
                    error: true
                    detail:
                      detail: Authentication credentials were not provided.
                    status_code: 401
                  summary: Raised exception with a single detail message (403/404/etc.)
          description: ''
    post:
      operationId: admin_stats_create
      description: |-
        DEPRECATED(app-split-phase2): the Vue in-app admin was removed; the
        Wagtail admin home page is the maintained surface (see
        shph.erp.dashboard.get_dashboard_context, the shared source below).
        Remove after phase 4 confirms no callers.
        GET /api/admin/stats/ — dashboard counts for admin (admin only).

        The aggregation logic lives in :mod:`shph.erp.dashboard` so the Wagtail
        admin home page and this DRF endpoint share a single source of truth.
        The response shape is preserved for backwards compatibility with the
        Vue admin and any external integrations.
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
