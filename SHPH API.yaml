      type: object
      description: |-
        Serializer for PATCH/PUT on an existing booking.

        Locks the money, listing, and schedule fields so a client cannot tamper with
        the price (e.g. PATCH total_price=1 then pay ₱1) or repoint/reschedule the
        booking outside the dedicated, slot-checked endpoints. total_price /
        fee_breakdown are always derived server-side (at creation, and recomputed in
        perform_update when hardware_parts_cost changes).
      properties:
        status:
          $ref: '#/components/schemas/ServiceBookingStatusEnum'
        notes:
          type: string
        hardware_parts_cost:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Optional hardware/parts cost entered by the provider.
        hardware_parts_cost_approved:
          type: boolean
          description: Set to False when the provider changes the parts cost; the
            customer must approve it before the provider can mark the job complete.
        provider_lat:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        provider_lng:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        completion_photo_url:
          type: string
          format: uri
          maxLength: 200
