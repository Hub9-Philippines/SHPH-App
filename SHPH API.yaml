          type: integer
          readOnly: true
        provider_id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/ServiceBookingStatusEnum'
        scheduled_date:
          type: string
          format: date
          nullable: true
        scheduled_time:
          type: string
          format: time
          nullable: true
