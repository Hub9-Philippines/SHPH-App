    StandardErrorResponse:
      type: object
      description: |-
        Matches the envelope built by ``shph.views.custom_exception_handler``.

        Every DRF-raised exception (401/403/404/405/429, ``ValidationError``,
        etc.) passes through that handler and comes out shaped exactly like
        this: ``{"error": True, "detail": <original response.data>,
        "status_code": <int>}``. ``detail`` stays a ``DictField`` rather than a
        precise nested serializer because its inner shape genuinely varies —
        sometimes a wrapped ``{"detail": "message"}``, sometimes a field-errors
        dict — so giving it a fake precise type would be dishonest. The two
        examples above show both real shapes instead of the generic
        additionalProp1/2/3 placeholder Swagger UI falls back to for an
        untyped object with no example attached.
      properties:
        error:
          type: boolean
        detail:
          type: object
          additionalProperties: {}
        status_code:
          type: integer
      required:
      - detail
      - error
      - status_code
