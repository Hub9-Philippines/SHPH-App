          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration:
          type: integer
          readOnly: true
          description: Duration in seconds
        reason:
          type: string
          nullable: true
          maxLength: 255
