          type: string
          readOnly: true
        review_count:
          type: integer
          readOnly: true
        provider_kyc_verified:
          type: boolean
          readOnly: true
        thumbnail:
          type: integer
          nullable: true
        images:
          type: array
          items:
            type: string
          readOnly: true
        city:
          type: string
          maxLength: 100
        province:
          type: string
          maxLength: 100
        latitude:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        longitude:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        service_location:
          type: object
          additionalProperties: {}
          description: |-
            Visible to the listing's owner (and staff) only.

            The listing endpoints are AllowAny, so anything returned here is world
            readable. Publishing the exact declared point would hand out a
            provider's precise location — frequently a home address — and would
            also make the jittered on-demand map pins trivially invertible: an
            anonymous scraper could pull the listing table and match each pin back
            to a named provider. Clients receive only the jittered pin, and full
            location after assignment.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        distance_km:
          type: number
          description: |-
            Distance to the caller-supplied point.

            Coarsened for non-owners to ~100m, matching the coordinates. At 2
            decimals this is 10m-accurate, and the endpoint accepts an arbitrary
            lat/lng — so three queries from different points trilaterate a listing
            far more precisely than the coarsened coordinates in the same response
            disclose. Rounding here is what makes that coarsening mean anything.
          readOnly: true
        is_featured:
          type: boolean
          readOnly: true
          description: Admin-promoted listings appear at the top of search/explore
            results.
      required:
      - base_price
      - category
      - category_is_on_demand
      - category_name
      - category_service_type
      - created_at
      - description
      - distance_km
      - id
      - images
