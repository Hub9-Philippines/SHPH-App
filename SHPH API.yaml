openapi: 3.0.3
info:
  title: SHPH API
  version: 1.0.0
  description: |-
    Serbisyo Hub PH — On-demand Service Provider Platform API

    ## Authentication
    Most endpoints require a JWT access token in the `Authorization` header:
    `Bearer <token>`

    ## Roles
    - **Client** — books services, pays, chats with providers
    - **Provider** — offers services, manages bookings, earns income
    - **Admin** — manages disputes, KYC, payouts (staff users)

    ## Post-over-GET
    For endpoints that return authenticated user data, a `POST` with an empty body `{}` is accepted as an alternative to `GET`. This prevents sensitive data from being logged in URL query strings.

    ## Pagination
    List endpoints return paginated responses:
    `{ count, next, previous, results }`
