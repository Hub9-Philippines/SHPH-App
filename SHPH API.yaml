    ChatMessage:
      type: object
      description: Serializer for chat messages
      properties:
        id:
          type: string
          readOnly: true
        thread:
          type: string
          readOnly: true
        sender:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Get sender with deleted-user safety. Uses sender_id to avoid
            cross-db FK object access which may return None.

            Prefers a pre-built user_cache from the view / consumer to avoid N+1.
          readOnly: true
        content:
          type: string
        file_attachment:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 2048
          - type: string
            maxLength: 0
        file_type:
          type: string
          nullable: true
          maxLength: 50
        file_type_display:
          type: string
          readOnly: true
        is_deleted:
          type: boolean
        edited_at:
          type: string
          format: date-time
          nullable: true
        reply_to:
          type: object
          additionalProperties: {}
          nullable: true
          description: Serialize the message this message is replying to.
          readOnly: true
        read_at:
          type: string
          nullable: true
          description: |-
            ISO timestamp of the most recent read water-mark among the OTHER
            participants (not the sender) whose watermark is at or after this
            message's created_at. Returns None when no other participant has read
            this message yet.

            This is what drives the WhatsApp-style ✓→✓✓ transition on the
            sender's own bubbles. Computed from the existing per-participant
            ``last_read_at`` water-mark — no extra model field needed.
          readOnly: true
        reactions:
          type: array
          items: {}
          description: |-
            Serialize the embedded ``reactions`` array as a list of
            ``{user_id, emoji, created_at}`` dicts. Returns [] when no
            reactions are present (keeps the JSON shape stable for the
            frontend). Delegates to ``ChatMessage.serialize_reactions()``.
          readOnly: true
        audio_duration:
          type: integer
          readOnly: true
          nullable: true
          description: Duration in seconds for voice-note messages (file_type='audio').
        sticker:
          type: string
          nullable: true
          maxLength: 100
        mentions:
          readOnly: true
        is_system_message:
          type: boolean
        is_pinned:
          type: boolean
          readOnly: true
        pinned_at:
          type: string
          nullable: true
          description: ISO timestamp of when the message was pinned, or None.
          readOnly: true
        pinned_by:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Resolve the user who pinned this message. Uses pinned_by_id to
            avoid cross-db FK object access. Reuses the sender lookup pattern
            with user_cache support.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - audio_duration
      - content
      - created_at
      - file_type_display
      - id
      - is_pinned
      - mentions
      - pinned_at
      - pinned_by
      - reactions
      - read_at
      - reply_to
      - sender
      - thread
      - updated_at
