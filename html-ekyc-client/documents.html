<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eKYC documents</title><link rel="stylesheet" href="app.css"></head><body data-page="documents"><main class="phone"><header class="head"><div class="top"><b>Step 2 of 3</b><span class="badge">Government ID</span></div><div class="progress"><i style="width:66%"></i></div></header><section class="content"><p class="eyebrow">IDENTITY DOCUMENT</p><h1 class="title">Upload both sides of your ID.</h1><p class="copy">Accepted: PhilID, passport, driver's license, UMID, or PRC ID. The photo must be clear and unexpired.</p><label>ID type<select><option>Philippine National ID (PhilID)</option><option>Passport</option><option>Driver's License</option><option>UMID</option><option>PRC ID</option></select></label><div class="card"><b>Front of ID</b><p class="copy">Show all corners and readable text.</p><button class="upload" data-upload>Upload front image</button></div><div class="card"><b>Back of ID</b><p class="copy">Include the reverse side if it contains information.</p><button class="upload" data-upload>Upload back image</button></div></section><footer class="footer"><button class="primary" data-go="liveness">Continue to face check</button></footer></main><script src="app.js"></script></body></html>
