  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.8.0


flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/images/app_launcher_icon.png'
  adaptive_icon_background: '#368eff'
  adaptive_icon_foreground: 'assets/images/app_launcher_icon.png'
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#368eff" # Background color
  image: assets/images/app_launcher_icon.png # Your logo

  android_12:
    image: assets/images/app_launcher_icon.png # Icon for Android 12+
    color: "#368eff"


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/



  # An image asset can refer to one or more resolution-specific "variants", see
