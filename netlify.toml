# Netlify deploy config for the Flutter web preview.
# Connect the repo in Netlify and it will pick this file up automatically.

[build]
  # Netlify's Linux runners don't ship Flutter; clone it (cached across builds
  # via the _flutter dir) then build.
  # IMPORTANT: keep FLUTTER_VERSION in sync with the local dev SDK
  # (`flutter --version`) AND with the intl pin in pubspec.yaml — each Flutter
  # release pins one exact intl version via flutter_localizations.
  command = """
    FLUTTER_VERSION=3.44.0
    if [ ! -d "_flutter/bin" ] || [ "$(_flutter/bin/flutter --version --machine 2>/dev/null | grep -o '"frameworkVersion":"[^"]*"' | cut -d'"' -f4)" != "$FLUTTER_VERSION" ]; then
      rm -rf _flutter
      git clone https://github.com/flutter/flutter.git --depth 1 -b "$FLUTTER_VERSION" _flutter
    fi
    export PATH="$PWD/_flutter/bin:$PATH"
    flutter config --no-analytics
    flutter pub get
    flutter build web --release --no-wasm-dry-run
  """
  publish = "build/web"

[build.environment]
  GIT_DEPTH = "1"

# SPA fallback: GoRouter handles routing client-side, so every path
# must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
