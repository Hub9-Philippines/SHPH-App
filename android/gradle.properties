# Allocate RAM and garbage collection properties
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Core AndroidX support
android.useAndroidX=true

# Keep compiler processes alive to avoid cold start times
org.gradle.daemon=true

# Compile independent plugins side-by-side simultaneously
org.gradle.parallel=true

# Keep Kotlin incremental compilation OFF: the relocated build dir makes
# incremental caches fail to relativize pub-cache sources ("different roots")
kotlin.incremental=false

# Legacy Flutter migration fallbacks
android.builtInKotlin=false
android.newDsl=false
