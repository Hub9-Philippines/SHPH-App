# Allocate RAM and garbage collection properties
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Core AndroidX support
android.useAndroidX=true

# Keep compiler processes alive to avoid cold start times
org.gradle.daemon=true

# Compile independent plugins side-by-side simultaneously
org.gradle.parallel=true

# Save previous build results so unchanged plugins skip re-compilation
org.gradle.caching=true

# Speed up Kotlin task compilation by reusing unchanged files
kotlin.incremental=true

# Legacy Flutter migration fallbacks
android.builtInKotlin=false
android.newDsl=false
