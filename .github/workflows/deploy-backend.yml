name: Deploy SHPH Backend to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions
          audience: sts.amazonaws.com

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build -t shph-backend:latest aws
          docker tag shph-backend:latest ${{ steps.login-ecr.outputs.registry }}/shph-backend:latest

      - name: Push Docker image
        working-directory: backend
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/shph-backend:latest

      - name: Install CDK dependencies
        working-directory: backend/aws/cdk
        run: npm ci

      - name: Validate CDK stack
        working-directory: backend/aws/cdk
        run: npx tsc --project tsconfig.json

      - name: Deploy CDK stack
        working-directory: backend/aws/cdk
        run: npx cdk deploy ShphBackendStack --require-approval never --context domainName=api.shph.com --context certificateArn=arn:aws:acm:ap-southeast-2:888577050475:certificate/3246a249-a910-46f9-abb0-e1184cdad8ab

      - name: Register ECS task definition
        working-directory: backend
        run: |
          sed -e "s|123456789012.dkr.ecr.us-east-1.amazonaws.com/shph-backend:latest|${{ steps.login-ecr.outputs.registry }}/shph-backend:latest|" aws/ecs-task-def.json > aws/ecs-task-def-generated.json
          aws ecs register-task-definition --cli-input-json file://aws/ecs-task-def-generated.json

      - name: Deploy ECS service
        run: |
          aws ecs update-service --cluster shph-backend-cluster --service shph-backend-service --force-new-deployment
